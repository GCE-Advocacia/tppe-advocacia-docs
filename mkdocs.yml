site_name: Documentação Técnica
site_description: Documentação técnica do projeto de advocacia
site_author: Equipe 8 de TPPE
site_url: https://gce-advocacia.github.io/tppe-advocacia-docs/

repo_name: GCE-Advocacia/tppe-advocacia-docs
repo_url: https://github.com/GCE-Advocacia/tppe-advocacia-docs

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - GCE:
    - Backlog do Produto:
      - Visão Geral: gce/backlog/index.md
      - US01 - Calendário de pagamentos: gce/backlog/us01.md
      - US02 - Notificações de vencimento: gce/backlog/us02.md
      - US03 - Controle de faturamento: gce/backlog/us03.md
      - US04 - Gestão de documentos: gce/backlog/us04.md
      - US05 - Atribuição de tarefas: gce/backlog/us05.md
      - US06 - Troca de imagens da Landing Page: gce/backlog/us06.md
      - US07 - Troca de cores da Landing Page: gce/backlog/us07.md
      - US08 - Troca da logo: gce/backlog/us08.md
      - US09 - Armazenamento no Google Drive: gce/backlog/us09.md
      - US11 - Permissão de visualização de vencimentos: gce/backlog/us11.md
      - US13 - Reestruturação da Landing Page: gce/backlog/us13.md
      - US14 - Sincronização dos temas com o sistema: gce/backlog/us14.md
      - US15 - Preset e logos do novo escritório: gce/backlog/us15.md
      - US16 - Customizador de curvatura dos botões: gce/backlog/us16.md
      - US17 - Preview multi-dispositivo: gce/backlog/us17.md
      - US21 - Migração para nuvem gratuita: gce/backlog/us21.md
      - US22 - Permissões de acesso por aba: gce/backlog/us22.md
      - US23 - Envio de e-mail confiável: gce/backlog/us23.md
      - US24 - Gestão do e-mail pelo admin: gce/backlog/us24.md
      - US25 - E-mail do escritório simples: gce/backlog/us25.md
    - Sprint 1: gce/sprint-01.md
    - Sprint 2: gce/sprint-02.md
    - Sprint 3: gce/sprint-03.md
  - Backlog:
    - Visão Geral: backlog/index.md
    - Status da Implementação: backlog/status.md
    #- Requisitos: backlog/requisitos.md
  - Arquitetura:
    - Estrutura Atual: arquitetura/estrutura-inicial.md
    - Modelo Físico do Banco: arquitetura/modelo-fisicodb.md
  - Protótipo: prototipo.md

